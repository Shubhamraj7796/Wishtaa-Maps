<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d9488" />
    <title>Wishtaa Maps is offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f8fa; color: #1c2430; font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 26rem; padding: 1.5rem; text-align: center; }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
      p { margin: .5rem 0; color: #4b5563; }
      button { margin-top: 1rem; padding: .6rem 1.2rem; border: 0; border-radius: .6rem; background: #0d9488; color: #fff; font: inherit; cursor: pointer; }
      @media (prefers-color-scheme: dark) { body { background: #0f1218; color: #e5e7eb; } p { color: #9ca3af; } }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Wishtaa Maps could not load, and this device has not opened it before while online.</p>
      <p>Connect to the internet and try again. Once it has loaded one time, it opens without a connection, and the maps saved in this browser are always there.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
